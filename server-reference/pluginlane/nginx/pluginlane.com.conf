server {
    listen 80;
    listen [::]:80;
    server_name www.pluginlane.com;
    if ($http_x_forwarded_proto != "https") { return 301 https://pluginlane.com$request_uri; }
    return 301 https://pluginlane.com$request_uri;
}
server {
    listen 80;
    listen [::]:80;
    server_name pluginlane.com;
    if ($http_x_forwarded_proto = "http") { return 301 https://pluginlane.com$request_uri; }
    root /var/www/pluginlane;
    include /etc/nginx/snippets/pluginlane-downloads.conf;
    index index.html;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;
    location = /stats { proxy_pass http://127.0.0.1:8790/stats; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-Host $host; }
    location = /stats/ { proxy_pass http://127.0.0.1:8790/stats; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-Host $host; }
    location ^~ /api/ { proxy_pass http://127.0.0.1:8790/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-Host $host; }
    location ^~ /packs/ {
        alias /var/www/pluginlane/packs/;
        default_type application/zip;
        add_header Cache-Control "private, no-store" always;
        location ~ /\. { deny all; }
    }
    location = /sitemap.xml/ { return 301 /sitemap.xml; }
    location ~ ^/sitemap.*\.xml\.gz$ { return 404; }
    location = /sitemap.xml { types { } default_type application/xml; charset utf-8; gzip off; add_header Cache-Control "no-store" always; try_files $uri =404; }
    location ~ ^/sitemap-.+\.xml$ { types { } default_type application/xml; charset utf-8; gzip off; add_header Cache-Control "no-store" always; try_files $uri =404; }
    location ^~ /click.ts { return 410; access_log off; }
    location ^~ /go/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /go/index.html;
    }
    location = /robots.txt {
        types { } default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location ~ "^/[a-f0-9]{32}\.txt$" {
        types { } default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
    location = /assets/search-index.json { try_files $uri =404; }
    location = /assets/style.css { try_files /assets/pd-dark.css =404; }
    location ~* \.(css|js|svg|xml|txt|json|woff2|woff|ttf)$ { try_files $uri =404; }
    location ~ /\. { deny all; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.pluginlane.com;
    ssl_certificate     /etc/nginx/ssl/pluginlane.com.crt;
    ssl_certificate_key /etc/nginx/ssl/pluginlane.com.key;
    return 301 https://pluginlane.com$request_uri;
}
