# plugin-dex.forum — download landing (isolated vhost; do not alter other sites)
server {
    listen 80;
    listen [::]:80;
    server_name www.plugin-dex.forum;
    return 301 https://plugin-dex.forum$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name plugin-dex.forum;
    return 301 https://plugin-dex.forum$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.plugin-dex.forum;
    ssl_certificate     /etc/nginx/ssl/plugin-dex.forum.crt;
    ssl_certificate_key /etc/nginx/ssl/plugin-dex.forum.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://plugin-dex.forum$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name plugin-dex.forum;

    ssl_certificate     /etc/nginx/ssl/plugin-dex.forum.crt;
    ssl_certificate_key /etc/nginx/ssl/plugin-dex.forum.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/plugin-dex-forum;
    include /etc/nginx/snippets/plugin-dex-forum-downloads.conf;
    index index.html;

    location = /stats {
        proxy_pass http://127.0.0.1:8787/stats;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /stats/ {
        proxy_pass http://127.0.0.1:8787/stats;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8787/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~ /\. { deny all; }
}
