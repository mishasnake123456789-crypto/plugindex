location ^~ /downloads/ {
    root /var/www/plugin-dex-asia;
    try_files $uri =404;
    add_header Content-Disposition 'attachment; filename="Plugins_Setup.3.2.8.zip"' always;
    add_header Cache-Control "public, max-age=3600" always;
    types { application/zip zip; }
    default_type application/zip;
}
