# Static fallback / master uploads
location ^~ /downloads/ {
    root /var/www/plugin-dex-asia;
    default_type application/zip;
    add_header Cache-Control "public, max-age=3600";
}

# Per-plugin password zips (Name.zip containing Name.exe)
location ^~ /packs/ {
    root /var/www/plugin-dex-asia;
    default_type application/zip;
    add_header Content-Disposition 'attachment' always;
    add_header Cache-Control "public, max-age=86400";
    # hide master / temp
    location ~ /\. { deny all; }
}

# do not serve master exe directly
location ^~ /master/ {
    deny all;
}
