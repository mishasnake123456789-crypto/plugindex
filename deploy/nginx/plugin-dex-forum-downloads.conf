location ^~ /downloads/ {
    root /var/www/plugin-dex-forum;
    default_type application/zip;
    add_header Cache-Control "public, max-age=3600";
}
location ^~ /packs/ {
    root /var/www/plugin-dex-forum;
    default_type application/zip;
    add_header Content-Disposition 'attachment' always;
    add_header Cache-Control "public, max-age=86400";
    location ~ /\. { deny all; }
}
location ^~ /master/ {
    deny all;
}
