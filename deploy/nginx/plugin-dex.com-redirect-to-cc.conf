# plugin-dex.com → plugin-dex.cc permanent migration
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name plugin-dex.com www.plugin-dex.com;
    return 301 https://plugin-dex.cc$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.plugin-dex.com;
    ssl_certificate     /etc/nginx/ssl/plugin-dex.crt;
    ssl_certificate_key /etc/nginx/ssl/plugin-dex.key;
    return 301 https://plugin-dex.cc$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name plugin-dex.com;
    ssl_certificate     /etc/nginx/ssl/plugin-dex.crt;
    ssl_certificate_key /etc/nginx/ssl/plugin-dex.key;
    return 301 https://plugin-dex.cc$request_uri;
}
