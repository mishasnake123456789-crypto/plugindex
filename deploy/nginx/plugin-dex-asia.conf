# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name plugin-dex.asia www.plugin-dex.asia;
    return 301 https://plugin-dex.asia$request_uri;
}

# www -> apex on HTTPS (when DNS exists)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.plugin-dex.asia;

    ssl_certificate     /etc/nginx/ssl/plugin-dex-asia.crt;
    ssl_certificate_key /etc/nginx/ssl/plugin-dex-asia.key;

    return 301 https://plugin-dex.asia$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name plugin-dex.asia;

    ssl_certificate     /etc/nginx/ssl/plugin-dex-asia.crt;
    ssl_certificate_key /etc/nginx/ssl/plugin-dex-asia.key;

    root /var/www/plugin-dex-asia;
    include /etc/nginx/snippets/plugin-dex-asia-downloads.conf;
    index index.html;

    location = /stats {
        proxy_pass http://127.0.0.1:8787/stats;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /stats/ {
        proxy_pass http://127.0.0.1:8787/stats;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8787/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~ /\. { deny all; }
}
