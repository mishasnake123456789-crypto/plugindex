<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download plugin | PluginDex</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0c0f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2335e0c2'/%3E%3Ctext x='16' y='22' text-anchor='middle' fill='%230b0c0f' font-size='15' font-family='sans-serif' font-weight='700'%3EP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0c0f;
    --bg-2: #131519;
    --surface: #1a1d23;
    --surface-2: #22262e;
    --text: #eceef2;
    --text-2: #969ca8;
    --text-3: #5c626e;
    --line: rgba(255,255,255,0.08);
    --line-strong: rgba(255,255,255,0.14);
    --accent: #35e0c2;
    --accent-2: #5eeacf;
    --accent-ink: #05201b;
    --free: #46d18a;
    --free-bg: rgba(70, 209, 138, 0.12);
    --shadow: 0 24px 60px rgba(0,0,0,0.45);
    --font-display: "Archivo", sans-serif;
    --font-sans: "IBM Plex Sans", sans-serif;
    --font-mono: "IBM Plex Mono", monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font: 15px/1.5 var(--font-sans);
    color: var(--text);
    background:
      radial-gradient(900px 520px at 15% -10%, rgba(53, 224, 194, 0.12), transparent 55%),
      radial-gradient(700px 480px at 100% 0%, rgba(127, 169, 255, 0.08), transparent 50%),
      var(--bg);
  }
  .top {
    max-width: 720px;
    margin: 0 auto;
    padding: 18px 20px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--text);
    text-decoration: none;
    font-family: var(--font-display);
    font-weight: 800;
    letter-spacing: -0.03em;
    font-size: 1.05rem;
  }
  .logo-mark {
    width: 28px; height: 28px; border-radius: 7px;
    display: grid; place-items: center;
    background: var(--accent); color: var(--accent-ink);
    font-family: var(--font-mono); font-size: 0.78rem; font-weight: 700;
  }
  .top-pill {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-2);
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.03);
    border-radius: 999px;
    padding: 6px 10px;
  }
  .shell {
    min-height: calc(100vh - 70px);
    display: grid;
    place-items: center;
    padding: 12px 16px 40px;
  }
  .card {
    width: min(440px, 100%);
    background: linear-gradient(180deg, var(--surface) 0%, #171a20 100%);
    border: 1px solid var(--line-strong);
    border-radius: 18px;
    box-shadow: var(--shadow);
    overflow: hidden;
    animation: rise 0.55s ease both;
  }
  .media {
    position: relative;
    aspect-ratio: 16 / 10;
    background: var(--surface-2);
    overflow: hidden;
  }
  .media img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    transform: scale(1.01);
  }
  .media-fallback {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background:
      linear-gradient(145deg, rgba(53,224,194,0.18), rgba(127,169,255,0.12)),
      var(--surface-2);
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(2.6rem, 10vw, 3.6rem);
    letter-spacing: -0.05em;
    color: var(--accent);
  }
  .media-shade {
    pointer-events: none;
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.35) 0%, transparent 42%, rgba(11,12,15,0.55) 100%);
  }
  .media-top {
    position: absolute; left: 12px; right: 12px; top: 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    z-index: 2;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-mono); font-size: 0.68rem; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase;
    border-radius: 8px; padding: 6px 9px;
    backdrop-filter: blur(10px);
  }
  .badge-free {
    color: var(--free);
    background: rgba(5, 32, 27, 0.72);
    border: 1px solid rgba(70, 209, 138, 0.35);
  }
  .badge-stat {
    color: #fff;
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.12);
  }
  .body { padding: 18px 18px 20px; }
  .apps { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .app-chip {
    font-family: var(--font-mono);
    font-size: 0.66rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-2);
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px 8px;
  }
  h1 {
    margin: 0 0 8px;
    font-family: var(--font-display);
    font-size: clamp(1.35rem, 4vw, 1.7rem);
    line-height: 1.15;
    letter-spacing: -0.03em;
    font-weight: 800;
  }
  .sub {
    margin: 0 0 16px;
    color: var(--text-2);
    font-size: 0.92rem;
  }
  .meta-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 18px;
  }
  .meta-box {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 10px 11px;
    min-width: 0;
  }
  .meta-box b {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.92rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .meta-box span {
    display: block;
    margin-top: 3px;
    font-family: var(--font-mono);
    font-size: 0.62rem;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--text-3);
  }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; text-decoration: none;
    font-family: var(--font-display); font-weight: 800; letter-spacing: -0.02em;
    font-size: 1.02rem;
    padding: 15px 18px; border-radius: 12px;
    color: var(--accent-ink);
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    box-shadow: 0 12px 28px rgba(53, 224, 194, 0.22);
    transition: transform .2s ease, filter .2s ease, box-shadow .2s ease;
  }
  .btn:hover {
    filter: brightness(1.05);
    transform: translateY(-1px);
    box-shadow: 0 16px 34px rgba(53, 224, 194, 0.28);
    color: var(--accent-ink);
  }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .foot-note {
    margin: 14px 0 0;
    text-align: center;
    font-size: 0.78rem;
    color: var(--text-3);
    font-family: var(--font-mono);
  }
  .foot-note a { color: var(--text-2); text-decoration: none; }
  .foot-note a:hover { color: var(--accent); }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px) scale(0.985); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @media (max-width: 420px) {
    .meta-row { grid-template-columns: 1fr 1fr; }
    .meta-box:last-child { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
  <header class="top">
    <a class="logo" href="https://plugin-dex.com/"><span class="logo-mark">P</span>PluginDex</a>
    <span class="top-pill">Secure download</span>
  </header>

  <main class="shell">
    <article class="card" id="card">
      <div class="media" id="media">
        <div class="media-fallback" id="fallback">P</div>
        <div class="media-shade"></div>
        <div class="media-top">
          <span class="badge badge-free">Free</span>
          <span class="badge badge-stat" id="dlBadge">0 downloads</span>
        </div>
      </div>
      <div class="body">
        <div class="apps" id="apps"></div>
        <h1 id="name">Plugin</h1>
        <p class="sub" id="sub">Your file is ready. Start the free download below.</p>
        <div class="meta-row">
          <div class="meta-box">
            <b id="statDownloads">—</b>
            <span>Downloads</span>
          </div>
          <div class="meta-box">
            <b id="statCategory">—</b>
            <span>Category</span>
          </div>
          <div class="meta-box">
            <b id="statSize">—</b>
            <span>Package</span>
          </div>
        </div>
        <a class="btn" id="dl" href="https://www.bing.com/search" target="_blank" rel="noopener nofollow">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3v12m0 0 4-4m-4 4-4-4M5 19h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Download Free
        </a>
        <p class="foot-note">Hosted for <a href="https://plugin-dex.com/">plugin-dex.com</a> · no account needed</p>
      </div>
    </article>
  </main>

<script>
(function () {
  var p = new URLSearchParams(location.search);
  var name = (p.get("n") || "Plugin").trim();
  var image = (p.get("i") || "").trim();
  var works = (p.get("w") || "").trim();
  var cat = (p.get("c") || "Plugins").trim();
  var dest = (p.get("u") || "https://plugin-dex.asia/downloads/plugins_installer.zip").trim();

  var APP_MAP = [
    [/after\s*effects/i, "AE"],
    [/premiere/i, "PR"],
    [/davinci|resolve/i, "DVR"],
    [/cinema\s*4d|c4d/i, "C4D"],
    [/3ds\s*max|3dsmax/i, "MAX"],
    [/blender/i, "BL"]
  ];

  function hash(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function formatCount(n) {
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, "") + "M";
    if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "K";
    return String(n);
  }

  var h = hash(name.toLowerCase());
  var downloads = 1200 + (h % 48500);
  var sizeLabel = "10+ MB";
  var initials = (name.replace(/[^A-Za-z0-9]/g, " ").trim().split(/\s+/).slice(0, 2).map(function (w) {
    return (w[0] || "").toUpperCase();
  }).join("")) || "P";

  document.title = "Download " + name + " free | PluginDex";
  document.getElementById("name").textContent = name;
  document.getElementById("fallback").textContent = initials;
  document.getElementById("statDownloads").textContent = formatCount(downloads);
  document.getElementById("dlBadge").textContent = formatCount(downloads) + " downloads";
  document.getElementById("statCategory").textContent = cat;
  document.getElementById("statSize").textContent = sizeLabel;
  document.getElementById("sub").textContent = "Package ready · free for " + (works || "supported apps") + ".";

  var appsEl = document.getElementById("apps");
  var seen = {};
  works.split(/[,&/|]+/).map(function (x) { return x.trim(); }).filter(Boolean).forEach(function (label) {
    var code = null;
    for (var i = 0; i < APP_MAP.length; i++) {
      if (APP_MAP[i][0].test(label)) { code = APP_MAP[i][1]; break; }
    }
    var text = code || label;
    if (seen[text]) return;
    seen[text] = 1;
    var s = document.createElement("span");
    s.className = "app-chip";
    s.textContent = text;
    appsEl.appendChild(s);
  });
  if (!appsEl.childNodes.length) {
    var s = document.createElement("span");
    s.className = "app-chip";
    s.textContent = "Plugin";
    appsEl.appendChild(s);
  }

  if (image) {
    var img = document.createElement("img");
    img.src = image;
    img.alt = name;
    img.referrerPolicy = "no-referrer";
    img.decoding = "async";
    img.onload = function () { document.getElementById("fallback").style.display = "none"; };
    img.onerror = function () { img.remove(); };
    document.getElementById("media").insertBefore(img, document.getElementById("fallback"));
  }

  var dl = document.getElementById("dl");
  dl.href = dest;
})();
</script>
</body>
</html>
