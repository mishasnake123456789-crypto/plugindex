<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preparing download | PluginDex</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Preparing your free plugin download on PluginDex.">
<link rel="canonical" href="https://plugin-dex.com/go/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/style.css?v=20261023e">
<style>
  .go-shell {
    min-height: calc(100vh - 140px);
    display: grid;
    place-items: center;
    padding: 40px 16px 64px;
  }
  .go-card {
    width: min(520px, 100%);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: var(--shadow-hover);
    overflow: hidden;
    animation: rise 0.55s ease both;
  }
  .go-media {
    position: relative;
    aspect-ratio: 16 / 10;
    background:
      linear-gradient(145deg, rgba(15, 118, 110, 0.18), rgba(29, 78, 216, 0.1)),
      var(--surface-2);
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .go-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .go-media .go-fallback {
    font-family: var(--font-display);
    font-size: clamp(2.5rem, 8vw, 3.5rem);
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -0.04em;
    opacity: 0.9;
  }
  .go-body { padding: 22px 22px 24px; }
  .go-kicker {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--free);
    background: var(--free-bg);
    border: 1px solid rgba(4, 120, 87, 0.18);
    border-radius: 999px;
    padding: 5px 10px;
    margin-bottom: 12px;
  }
  .go-kicker i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--free);
    display: inline-block;
    animation: pulse 1.2s ease infinite;
  }
  .go-card h1 {
    font-size: clamp(1.45rem, 3.5vw, 1.85rem);
    max-width: none;
    margin: 0 0 10px;
    line-height: 1.15;
  }
  .go-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 0 0 18px;
  }
  .go-progress {
    height: 8px;
    border-radius: 999px;
    background: var(--bg-2);
    overflow: hidden;
    margin: 8px 0 10px;
  }
  .go-progress > span {
    display: block;
    height: 100%;
    width: 0%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--accent-2), var(--accent));
    transition: width 0.2s linear;
  }
  .go-status {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--muted);
    margin: 0 0 18px;
  }
  .go-actions { display: grid; gap: 10px; }
  .go-actions .btn[disabled] {
    opacity: 0.55;
    cursor: wait;
    filter: none;
    transform: none;
    box-shadow: none;
  }
  .go-skip {
    text-align: center;
    font-size: 0.88rem;
    color: var(--muted);
  }
  .go-skip a { color: var(--muted); text-decoration: underline; }
  .go-skip a:hover { color: var(--accent); }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.85); }
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <a class="logo" href="/"><span class="logo-mark">P</span>PluginDex</a>
    <nav class="nav" aria-label="Apps">
      <a href="/after-effects/">After Effects</a>
      <a href="/premiere-pro/">Premiere Pro</a>
      <a href="/blender/">Blender</a>
    </nav>
  </div>
</header>

<main class="go-shell">
  <article class="go-card" id="card">
    <div class="go-media" id="media">
      <div class="go-fallback" id="fallback">P</div>
    </div>
    <div class="go-body">
      <div class="go-kicker"><i></i> Free download</div>
      <h1 id="name">Preparing plugin…</h1>
      <div class="go-meta" id="meta"></div>
      <div class="go-progress" aria-hidden="true"><span id="bar"></span></div>
      <p class="go-status" id="status">Preparing your download…</p>
      <div class="go-actions">
        <a class="btn" id="dl" href="#" rel="noopener nofollow">Download starts in <span id="sec">5</span>…</a>
        <p class="go-skip"><a id="skip" href="#">Download now</a></p>
      </div>
    </div>
  </article>
</main>

<footer class="foot">
  <div class="wrap foot-in" style="grid-template-columns:1fr;padding-top:20px;padding-bottom:24px">
    <div>
      <a class="logo" href="/"><span class="logo-mark">P</span>PluginDex</a>
      <p class="muted" style="margin:8px 0 0;font-size:.9rem">Free plugin catalog for motion design, editing and 3D.</p>
    </div>
  </div>
</footer>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var name = params.get("n") || "Plugin";
  var image = params.get("i") || "";
  var works = params.get("w") || "";
  var cat = params.get("c") || "";
  var dest = params.get("u") || ("https://www.bing.com/search?q=" + encodeURIComponent(name + " plugin download"));
  var seconds = 5;

  document.title = "Download " + name + " free | PluginDex";
  document.getElementById("name").textContent = name;
  document.getElementById("fallback").textContent = (name.replace(/[^A-Za-z0-9]/g, " ").trim().split(/\s+/).slice(0, 2).map(function (w) { return w[0] || ""; }).join("") || "P").toUpperCase();

  var meta = document.getElementById("meta");
  function chip(text) {
    var s = document.createElement("span");
    s.className = "chip";
    s.textContent = text;
    meta.appendChild(s);
  }
  works.split(/[,&]/).map(function (x) { return x.trim(); }).filter(Boolean).forEach(chip);
  if (cat) chip(cat);

  if (image) {
    var img = document.createElement("img");
    img.src = image;
    img.alt = name;
    img.referrerPolicy = "no-referrer";
    img.onload = function () {
      document.getElementById("fallback").style.display = "none";
    };
    img.onerror = function () { img.remove(); };
    document.getElementById("media").appendChild(img);
  }

  var btn = document.getElementById("dl");
  var skip = document.getElementById("skip");
  var bar = document.getElementById("bar");
  var status = document.getElementById("status");
  var sec = document.getElementById("sec");
  btn.href = dest;
  skip.href = dest;
  btn.setAttribute("target", "_blank");
  skip.setAttribute("target", "_blank");

  var left = seconds;
  var started = Date.now();
  var timer = setInterval(function () {
    var elapsed = (Date.now() - started) / 1000;
    var pct = Math.min(100, (elapsed / seconds) * 100);
    bar.style.width = pct + "%";
    left = Math.max(0, Math.ceil(seconds - elapsed));
    sec.textContent = String(left);
    if (left <= 0) {
      clearInterval(timer);
      bar.style.width = "100%";
      status.textContent = "Ready — click to download free.";
      btn.textContent = "Download Free";
      btn.removeAttribute("disabled");
      // auto-open once
      try { window.open(dest, "_blank", "noopener,noreferrer"); } catch (e) {}
    }
  }, 100);

  btn.addEventListener("click", function () {
    status.textContent = "Opening download…";
  });
})();
</script>
</body>
</html>
